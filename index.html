<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monetized 1-on-1 Call & Chat Portal</title>
  <script src="https://download.agora.io/sdk/web/AgoraRTC_N-4.20.0.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; height: 100vh; overflow: hidden; }
    
    /* Left Panel: Main App */
    .main-panel { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 12px; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 12px 15px; border-radius: 12px; }
    .header h2 { color: #38bdf8; font-size: 18px; }
    
    /* Settings / Inputs */
    .config-bar { display: flex; gap: 8px; background: #1e293b; padding: 10px; border-radius: 12px; flex-wrap: wrap; }
    .config-bar input { background: #0f172a; border: 1px solid #334155; color: white; padding: 8px; border-radius: 6px; flex: 1; font-size: 14px; min-width: 120px; }
    
    /* Video Area */
    .stage { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #020617; padding: 10px; border-radius: 12px; min-height: 250px; }
    .video-box { background: #1e293b; border-radius: 10px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; border: 1px solid #334155; min-height: 180px; }
    .video-box .label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 3px 6px; border-radius: 4px; font-size: 11px; z-index: 10; }
    .avatar { font-size: 36px; display: none; }
    .audio-only .avatar { display: block; }
    
    /* Controls Bar */
    .controls { display: flex; justify-content: center; gap: 10px; background: #1e293b; padding: 12px; border-radius: 12px; flex-wrap: wrap; }
    button { background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; }
    button:hover { background: #0369a1; }
    button.danger { background: #e11d48; }
    button.success { background: #16a34a; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    /* Right Panel: Chat & Monetization */
    .side-panel { width: 320px; background: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; }
    .side-header { padding: 12px; border-bottom: 1px solid #334155; font-weight: bold; color: #38bdf8; text-align: center; font-size: 15px; }
    
    /* Price Banner */
    .pricing-card { background: #0f172a; margin: 12px; padding: 12px; border-radius: 10px; border: 1px solid #38bdf8; text-align: center; }
    .pricing-card h3 { color: #4ade80; font-size: 20px; margin-top: 4px; }
    
    /* Chat Area */
    .chat-box { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; max-height: 200px; }
    .message { background: #334155; padding: 8px 10px; border-radius: 8px; font-size: 13px; max-width: 85%; }
    .message.me { background: #0284c7; align-self: flex-end; }
    .chat-input { display: flex; padding: 8px; gap: 6px; border-top: 1px solid #334155; background: #0f172a; }
    .chat-input input { flex: 1; background: #1e293b; border: 1px solid #334155; color: white; padding: 8px; border-radius: 6px; font-size: 13px; }

    /* Modal / UPI Pay Screen */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .modal-content { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 320px; width: 100%; text-align: center; border: 1px solid #38bdf8; }

    /* MOBILE RESPONSIVE DESIGN (For Phones) */
    @media (max-width: 768px) {
      body { flex-direction: column; height: 100vh; overflow-y: auto; }
      .side-panel { width: 100%; border-left: none; border-top: 1px solid #334155; height: auto; }
      .stage { grid-template-columns: 1fr; min-height: 200px; }
      .video-box { min-height: 140px; }
      .chat-box { max-height: 150px; }
    }
  </style>
</head>
<body>

  <!-- Left Main Area -->
  <div class="main-panel">
    <div class="header">
      <h2>1-on-1 Portal</h2>
      <div id="status-badge" style="color: #38bdf8; font-size: 13px;">Status: Idle</div>
    </div>

    <!-- Agora Credentials setup -->
    <div class="config-bar">
      <input type="text" id="app-id" placeholder="Paste Agora App ID">
      <input type="text" id="channel-name" value="room-1" placeholder="Channel">
      <input type="number" id="call-price" value="299" style="max-width: 80px;" placeholder="₹">
      <button onclick="updateSettings()">Set</button>
    </div>

    <!-- Video Containers -->
    <div class="stage">
      <div id="local-player" class="video-player video-box">
        <span class="label">You (Host)</span>
        <div class="avatar" id="local-avatar">👤</div>
      </div>
      <div id="remote-player" class="video-player video-box">
        <span class="label">Customer</span>
        <div class="avatar" id="remote-avatar">👤</div>
      </div>
    </div>

    <!-- Control Buttons -->
    <div class="controls">
      <button class="success" id="start-call-btn" onclick="openPaymentOrJoin('video')">📹 Video</button>
      <button class="success" id="start-voice-btn" onclick="openPaymentOrJoin('audio')">🎙️ Voice</button>
      <button class="danger" id="leave-btn" onclick="leaveCall()" disabled>🔴 End</button>
      <button onclick="copyInviteLink()">🔗 Link</button>
    </div>
  </div>

  <!-- Right Side Panel: Chat & Pricing -->
  <div class="side-panel">
    <div class="side-header">Live Chat & Payment</div>
    
    <div class="pricing-card">
      <div style="font-size: 11px; color: #94a3b8;">Session Fee</div>
      <h3 id="display-price">₹299</h3>
      <div style="font-size: 10px; color: #94a3b8; margin-top: 2px;">Pay via UPI / Card</div>
    </div>

    <!-- Chat Messages -->
    <div class="chat-box" id="chat-messages">
      <div class="message">Welcome! Type a message or start a call.</div>
    </div>

    <!-- Chat Input -->
    <div class="chat-input">
      <input type="text" id="chat-msg-input" placeholder="Type message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- Simulated Payment Modal -->
  <div class="modal" id="pay-modal">
    <div class="modal-content">
      <h3>Unlock Session</h3>
      <p style="margin: 8px 0; color: #94a3b8; font-size: 13px;">Complete payment to join:</p>
      <div style="font-size: 24px; color: #4ade80; font-weight: bold; margin: 10px 0;" id="modal-price">₹299</div>
      
      <div style="background: #0f172a; padding: 8px; border-radius: 6px; margin-bottom: 12px; font-size: 12px;">
        💳 UPI / GPay / PhonePe / Card
      </div>

      <button class="success" style="width: 100%; margin-bottom: 6px;" onclick="completePayment()">Simulate Paid Entry</button>
      <button class="danger" style="width: 100%;" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script>
    let client = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
    let localAudioTrack, localVideoTrack;
    let isPaid = false;
    let pendingCallType = 'video';

    function updateSettings() {
      const price = document.getElementById('call-price').value;
      document.getElementById('display-price').innerText = `₹${price}`;
      document.getElementById('modal-price').innerText = `₹${price}`;
      alert('Price updated to ₹' + price);
    }

    function openPaymentOrJoin(type) {
      pendingCallType = type;
      if (!isPaid) {
        document.getElementById('pay-modal').style.display = 'flex';
      } else {
        startCall(type);
      }
    }

    function closeModal() {
      document.getElementById('pay-modal').style.display = 'none';
    }

    function completePayment() {
      isPaid = true;
      closeModal();
      alert('Payment Verified! Entering room...');
      startCall(pendingCallType);
    }

    async function startCall(type) {
      const appId = document.getElementById('app-id').value.trim();
      const channel = document.getElementById('channel-name').value.trim();

      if (!appId) {
        alert("Please paste your Agora App ID at the top first!");
        return;
      }

      document.getElementById('status-badge').innerText = "Connecting...";

      await client.join(appId, channel, null, null);
      localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();

      if (type === 'video') {
        localVideoTrack = await AgoraRTC.createCameraVideoTrack();
        localVideoTrack.play("local-player");
        await client.publish([localAudioTrack, localVideoTrack]);
        document.getElementById('local-avatar').style.display = 'none';
      } else {
        await client.publish([localAudioTrack]);
        document.getElementById('local-avatar').style.display = 'block';
      }

      document.getElementById('start-call-btn').disabled = true;
      document.getElementById('start-voice-btn').disabled = true;
      document.getElementById('leave-btn').disabled = false;
      document.getElementById('status-badge').innerText = "Connected (" + type.toUpperCase() + ")";

      client.on("user-published", async (user, mediaType) => {
        await client.subscribe(user, mediaType);
        if (mediaType === "video") {
          user.videoTrack.play("remote-player");
          document.getElementById('remote-avatar').style.display = 'none';
        }
        if (mediaType === "audio") {
          user.audioTrack.play();
        }
      });
    }

    async function leaveCall() {
      if (localAudioTrack) localAudioTrack.close();
      if (localVideoTrack) localVideoTrack.close();
      await client.leave();

      document.getElementById('start-call-btn').disabled = false;
      document.getElementById('start-voice-btn').disabled = false;
      document.getElementById('leave-btn').disabled = true;
      document.getElementById('status-badge').innerText = "Ended";
    }

    function sendMessage() {
      const input = document.getElementById('chat-msg-input');
      if (!input.value.trim()) return;

      const chatBox = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message me';
      msgDiv.innerText = input.value;
      chatBox.appendChild(msgDiv);
      
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function copyInviteLink() {
      const channel = document.getElementById('channel-name').value;
      const url = window.location.origin + window.location.pathname + '?channel=' + channel;
      navigator.clipboard.writeText(url);
      alert("Invite link copied!");
    }
  </script>
</body>
</html>
